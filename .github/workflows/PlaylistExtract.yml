name: Extract YouTube Playlist

on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Playlist URL"
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Extract playlist
        run: |
          yt-dlp \
            --flat-playlist \
            --dump-single-json \
            "${{ github.event.inputs.playlist }}" > playlist.json

      - name: Generate markdown
        run: |
          python <<EOF
          import json

          with open("playlist.json") as f:
              data = json.load(f)

          with open("playlist.md", "w", encoding="utf-8") as md:
              md.write("| Title | Link |\n")
              md.write("|---|---|\n")

              for e in data["entries"]:
                  title = e["title"].replace("|", "\\|")
                  url = f"https://youtube.com/watch?v={e['id']}"
                  md.write(f"| {title} | {url} |\n")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: playlist-md
          path: playlist.md
