name: Extract YouTube Playlist → Commit

on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Playlist URL"
        required: true

permissions:
  contents: write   # REQUIRED for pushing

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3   # cleaner than pip install :contentReference[oaicite:0]{index=0}

      - name: Extract playlist JSON
        run: |
          yt-dlp \
            --flat-playlist \
            --dump-single-json \
            "${{ github.event.inputs.playlist }}" > playlist.json

      - name: Generate Markdown
        run: |
          python <<EOF
          import json

          with open("playlist.json", encoding="utf-8") as f:
              data = json.load(f)

          with open("playlist.md", "w", encoding="utf-8") as md:
              md.write("| # | Title | Link |\n")
              md.write("|---|------|------|\n")

              for i, e in enumerate(data["entries"], start=1):
                  title = e["title"].replace("|", "\\|")
                  url = f"https://youtube.com/watch?v={e['id']}"
                  md.write(f"| {i} | {title} | {url} |\n")
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add playlist.md

          # Avoid failing if no changes
          git diff --cached --quiet || git commit -m "Update playlist.md"

          git push
